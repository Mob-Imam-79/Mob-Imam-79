<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
<title id="title">AI developer core</title>
<desc id="desc">Animated cyberpunk developer profile graphic for Md Mobashir Imam.</desc>
<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#05060b"/>
  <stop offset="0.55" stop-color="#09051a"/>
  <stop offset="1" stop-color="#020308"/>
</linearGradient>
<linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#00E5FF"/>
  <stop offset="0.5" stop-color="#7C3AED"/>
  <stop offset="1" stop-color="#00E5FF"/>
</linearGradient>
<radialGradient id="cyanGlow">
  <stop offset="0" stop-color="#00E5FF" stop-opacity=".9"/>
  <stop offset=".35" stop-color="#00E5FF" stop-opacity=".25"/>
  <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
</radialGradient>
<radialGradient id="purpleGlow">
  <stop offset="0" stop-color="#7C3AED" stop-opacity=".8"/>
  <stop offset=".35" stop-color="#7C3AED" stop-opacity=".22"/>
  <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="14"/>
</filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#00E5FF" stroke-opacity=".10" stroke-width="1"/>
</pattern>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
</style>

</defs>

<rect width="560" height="300" rx="24" fill="url(#bg)" stroke="#142238"/>
<rect x="12" y="12" width="536" height="276" rx="18" fill="url(#grid)"/>
<circle cx="280" cy="150" r="118" fill="url(#cyanGlow)" opacity=".32">
  <animate attributeName="r" values="105;130;105" dur="4s" repeatCount="indefinite"/>
</circle>
<g fill="none" stroke="url(#cyanPurple)" filter="url(#glow)">
  <ellipse cx="280" cy="150" rx="180" ry="58" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" from="0 280 150" to="360 280 150" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="280" cy="150" rx="150" ry="95" stroke-width="1.5" transform="rotate(55 280 150)">
    <animateTransform attributeName="transform" type="rotate" from="55 280 150" to="-305 280 150" dur="13s" repeatCount="indefinite"/>
  </ellipse>
</g>
<circle cx="280" cy="150" r="62" fill="#03050D" stroke="#00E5FF" stroke-width="2" filter="url(#glow)"/>
<circle cx="280" cy="150" r="40" fill="#7C3AED" opacity=".18">
  <animate attributeName="opacity" values=".1;.4;.1" dur="3s" repeatCount="indefinite"/>
</circle>
<text x="280" y="146" text-anchor="middle" fill="#F5F7FF" font-size="26" font-weight="900" class="sans">AI</text>
<text x="280" y="168" text-anchor="middle" fill="#00E5FF" font-size="11" class="mono">AGENT CORE</text>

<g font-size="11" class="mono">
  <g fill="#00E5FF"><circle cx="112" cy="80" r="5"/><text x="125" y="84">PYTHON</text></g>
  <g fill="#7C3AED"><circle cx="440" cy="82" r="5"/><text x="453" y="86">LANGGRAPH</text></g>
  <g fill="#00E5FF"><circle cx="90" cy="225" r="5"/><text x="103" y="229">DJANGO</text></g>
  <g fill="#7C3AED"><circle cx="445" cy="224" r="5"/><text x="458" y="228">ML / GENAI</text></g>
</g>

</svg>
