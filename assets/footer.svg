<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
<title id="title">Md Mobashir Imam profile footer</title>
<desc id="desc">Animated cyberpunk developer profile graphic for Md Mobashir Imam.</desc>
<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#05060b"/>
  <stop offset="0.55" stop-color="#09051a"/>
  <stop offset="1" stop-color="#020308"/>
</linearGradient>
<linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#00E5FF"/>
  <stop offset="0.5" stop-color="#7C3AED"/>
  <stop offset="1" stop-color="#00E5FF"/>
</linearGradient>
<radialGradient id="cyanGlow">
  <stop offset="0" stop-color="#00E5FF" stop-opacity=".9"/>
  <stop offset=".35" stop-color="#00E5FF" stop-opacity=".25"/>
  <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
</radialGradient>
<radialGradient id="purpleGlow">
  <stop offset="0" stop-color="#7C3AED" stop-opacity=".8"/>
  <stop offset=".35" stop-color="#7C3AED" stop-opacity=".22"/>
  <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="14"/>
</filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#00E5FF" stroke-opacity=".10" stroke-width="1"/>
</pattern>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
</style>

</defs>

<rect width="1200" height="170" rx="24" fill="url(#bg)"/>
<rect x="12" y="12" width="1176" height="146" rx="18" fill="url(#grid)"/>
<g opacity=".5" stroke="#00E5FF">
  <path d="M0 125 Q180 92 360 125 T720 125 T1080 125 T1440 125" fill="none"/>
  <path d="M0 140 Q180 107 360 140 T720 140 T1080 140 T1440 140" fill="none"/>
</g>
<g fill="none" stroke="url(#cyanPurple)" filter="url(#glow)">
  <ellipse cx="600" cy="132" rx="300" ry="24" stroke-width="2">
    <animate attributeName="rx" values="250;340;250" dur="5s" repeatCount="indefinite"/>
  </ellipse>
</g>
<text x="600" y="72" text-anchor="middle" fill="#F5F7FF" font-size="25" font-weight="800" class="sans">BUILD • LEARN • SHIP • REPEAT</text>
<text x="600" y="100" text-anchor="middle" fill="#00E5FF" font-size="12" letter-spacing="4" class="mono">MD MOBASHIR IMAM // END OF PROFILE</text>

</svg>
