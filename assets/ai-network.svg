<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
<title id="title">Autonomous AI network</title>
<desc id="desc">Animated cyberpunk developer profile graphic for Md Mobashir Imam.</desc>
<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#05060b"/>
  <stop offset="0.55" stop-color="#09051a"/>
  <stop offset="1" stop-color="#020308"/>
</linearGradient>
<linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#00E5FF"/>
  <stop offset="0.5" stop-color="#7C3AED"/>
  <stop offset="1" stop-color="#00E5FF"/>
</linearGradient>
<radialGradient id="cyanGlow">
  <stop offset="0" stop-color="#00E5FF" stop-opacity=".9"/>
  <stop offset=".35" stop-color="#00E5FF" stop-opacity=".25"/>
  <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
</radialGradient>
<radialGradient id="purpleGlow">
  <stop offset="0" stop-color="#7C3AED" stop-opacity=".8"/>
  <stop offset=".35" stop-color="#7C3AED" stop-opacity=".22"/>
  <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="14"/>
</filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#00E5FF" stroke-opacity=".10" stroke-width="1"/>
</pattern>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
</style>

</defs>

<rect width="560" height="300" rx="24" fill="url(#bg)" stroke="#142238"/>
<rect x="12" y="12" width="536" height="276" rx="18" fill="url(#grid)"/>
<g stroke="url(#cyanPurple)" stroke-width="1.5" opacity=".65">
  <path d="M90 82 L210 145 L330 70 L470 120 L380 230 L220 215 L90 82"/>
  <path d="M210 145 L220 215"/>
  <path d="M330 70 L380 230"/>
  <path d="M470 120 L380 230"/>
</g>
<g fill="#00E5FF" filter="url(#glow)">
  <circle cx="90" cy="82" r="6"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="145" r="7"><animate attributeName="r" values="5;9;5" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="70" r="6"><animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="470" cy="120" r="6"><animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<g fill="#7C3AED" filter="url(#glow)">
  <circle cx="380" cy="230" r="7"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="220" cy="215" r="6"><animate attributeName="r" values="4;8;4" dur="2.1s" repeatCount="indefinite"/></circle>
</g>
<circle cx="280" cy="150" r="26" fill="#03050D" stroke="#00E5FF" filter="url(#glow)"/>
<text x="280" y="155" text-anchor="middle" fill="#F5F7FF" font-size="12" class="mono">AGENT</text>
<text x="28" y="42" fill="#00E5FF" font-size="11" letter-spacing="3" class="mono">NEURAL NETWORK / ACTIVE</text>

</svg>
