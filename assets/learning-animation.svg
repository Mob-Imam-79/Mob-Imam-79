<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
<title id="title">Learning pipeline</title>
<desc id="desc">Animated cyberpunk developer profile graphic for Md Mobashir Imam.</desc>
<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#05060b"/>
  <stop offset="0.55" stop-color="#09051a"/>
  <stop offset="1" stop-color="#020308"/>
</linearGradient>
<linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#00E5FF"/>
  <stop offset="0.5" stop-color="#7C3AED"/>
  <stop offset="1" stop-color="#00E5FF"/>
</linearGradient>
<radialGradient id="cyanGlow">
  <stop offset="0" stop-color="#00E5FF" stop-opacity=".9"/>
  <stop offset=".35" stop-color="#00E5FF" stop-opacity=".25"/>
  <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
</radialGradient>
<radialGradient id="purpleGlow">
  <stop offset="0" stop-color="#7C3AED" stop-opacity=".8"/>
  <stop offset=".35" stop-color="#7C3AED" stop-opacity=".22"/>
  <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="14"/>
</filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#00E5FF" stroke-opacity=".10" stroke-width="1"/>
</pattern>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
</style>

</defs>

<rect width="560" height="300" rx="24" fill="url(#bg)" stroke="#142238"/>
<rect x="12" y="12" width="536" height="276" rx="18" fill="url(#grid)"/>
<text x="30" y="42" fill="#00E5FF" font-size="11" letter-spacing="3" class="mono">LEARNING_PIPELINE</text>
<g transform="translate(280 158)">
  <circle r="92" fill="none" stroke="#101A2C" stroke-width="18"/>
  <circle r="92" fill="none" stroke="url(#cyanPurple)" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="180 578" transform="rotate(-90)">
    <animate attributeName="stroke-dasharray" values="120 638;430 328;120 638" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle r="58" fill="#03050D" stroke="#00E5FF" stroke-opacity=".5"/>
  <text y="-5" text-anchor="middle" fill="#F5F7FF" font-size="17" font-weight="800" class="sans">BUILD</text>
  <text y="17" text-anchor="middle" fill="#7C3AED" font-size="11" class="mono">ITERATE</text>
</g>
<g class="mono" font-size="11">
  <text x="62" y="235" fill="#A8B3C7">DJANGO</text>
  <text x="175" y="235" fill="#A8B3C7">ML</text>
  <text x="270" y="235" fill="#A8B3C7">GENAI</text>
  <text x="385" y="235" fill="#A8B3C7">AGENTS</text>
</g>

</svg>
